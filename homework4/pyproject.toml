[project]
name = "homework4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pydantic-ai>=2.59.0",
    "pydantic-ai-slim[groq]>=2.59.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# The model clients are created once, at import. pytest-asyncio gives each
# test its own event loop by default, so the second test would use a client
# tied to the first test's closed loop ("Event loop is closed").
# One loop for the whole session avoids that.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
