[project]
name = "analyst"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "logfire>=5.4.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[groq,openai]>=2.59.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.29.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# The project lives in OneDrive, which refuses uv's default hardlinks
# ("incompatible hardlinks", os error 396). Copying always works.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked llm call the real model (slow, uses API calls, results can vary).
# Skipped by default; run them with: uv run pytest -m llm
markers = ["llm: calls the real LLM"]
addopts = "-m 'not llm'"

[tool.logfire]
# Tests and evals never call trace.setup(); spans are then silent no-ops.
ignore_no_config = true
